name: CI

on:
  push:
    branches: [main, gt-ccs-streamlit, GT-CCUS-graph-streamlit]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (suite + golden regression)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: pytest tests -q --runslow